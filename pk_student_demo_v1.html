skdesc{color:var(--sub);font-size:13px;margin:7px 0 0}.taskmenu{background:none;border:0;color:#738098;font-size:20px;padding:0 5px}.side{display:grid;gap:14px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow)}.panelhead{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.panelhead h3{font:600 17px Kanit;margin:0}.linkbtn{background:none;border:0;color:var(--blue);font-size:12px;font-weight:700}.announcement{border-left:3px solid var(--amber);padding:2px 0 2px 11px;margin:12px 0}.announcement b{display:block;font-size:13px}.announcement p{font-size:12px;color:var(--sub);margin:3px 0}.announcement time{font-size:11px;color:#9aa2af}.people{display:flex;align-items:center;justify-content:space-between;padding:7px 0}.person{display:flex;align-items:center;gap:9px}.avatar{width:32px;height:32px;display:grid;place-items:center;background:#f0e6d6;border-radius:50%;font-size:16px}.pname{font-size:13px;font-weight:600}.pdone{font-size:11px;color:var(--sub)}.morepeople{padding-top:9px;color:var(--sub);font-size:12px;border-top:1px solid var(--line);margin-top:5px}.empty{padding:34px 20px;text-align:center;color:var(--sub);background:#ffffffa6;border:1px dashed #cbd1da;border-radius:16px}.mobile-nav{display:none}.primary{background:var(--blue);border:0;border-radius:11px;color:white;padding:10px 15px;font-weight:600}.secondary{background:white;border:1px solid var(--line);border-radius:11px;color:var(--ink);padding:10px 14px;font-weight:600}.modalback{position:fixed;inset:0;background:#11203e70;display:none;align-items:center;justify-content:center;padding:18px;z-index:9}.modalback.show{display:flex}.modal{width:min(480px,100%);background:var(--paper);border-radius:21px;padding:22px;box-shadow:0 28px 80px #101d3950;max-height:90vh;overflow:auto}.modal h2{font:600 23px Kanit;margin:0 0 5px}.modal .hint{color:var(--sub);font-size:13px;margin:0 0 18px}.field{display:grid;gap:5px;margin:12px 0}.field label{font-weight:600;font-size:13px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;background:white;padding:10px 12px;color:var(--ink)}.field textarea{min-height:85px;resize:vertical}.modalactions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 17px;border-radius:12px;z-index:20;box-shadow:var(--shadow);display:none}.toast.show{display:block}.adminpanel{display:none}.adminpanel.show{display:block}.admin-tabs{display:flex;gap:7px;margin:14px 0}.admin-tabs button{border:1px solid var(--line);background:white;padding:8px 11px;border-radius:9px}.admin-tabs button.active{background:var(--blue2);color:var(--blue);border-color:#cbd4ff}.admin-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0}.admin-row:last-child{border:0}.danger{color:var(--red);background:#fff4f2;border:0;border-radius:8px;padding:7px 9px}.overlay{position:fixed;inset:0;background:#10203d88;z-index:8;display:none;align-items:center;justify-content:center;padding:16px}.overlay.show{display:flex}.overlay .modal{width:min(620px,100%)}.notice{font-size:12px;color:var(--sub);background:#eef0f5;padding:9px 11px;border-radius:9px;margin:10px 0}

<body><div class="shell">
<header class="topbar"><div class="brand"><span class="brandmark">PK</span> PK STUDENT <span class="room-tag">ห้อง 5/4</span></div><div class="rightbar"><button class="admin-open" id="adminBtn">⚙ แอดมิน</button></div></header>

<section class="statgrid"><div class="stat main"><div class="statlabel">งานที่ยังต้องส่ง</div><div class="statvalue"><span id="pendingCount">0</span> <small>รายการ</small></div><div class="statfoot" id="pendingHint"></div></div><div class="stat"><div class="statlabel">ใกล้ถึงกำหนด</div><div class="statvalue" id="soonCount">0</div><div class="statfoot">ภายใน 2 วัน</div></div><div class="stat"><div class="statlabel">สมาชิกห้อง</div><div class="statvalue" id="memberCount">0</div><div class="statfoot">ห้อง 5/4</div></div></section>
<main><div class="toolbar"><h2>รายการงาน</h2><div class="filters"><label class="search"><input id="search" placeholder="ค้นหางานหรือวิชา" aria-label="ค้นหางานหรือวิชา"></label><select id="filter" class="select" aria-label="กรองงาน"><option value="all">ทุกงาน</option><option value="open">ยังไม่เสร็จ</option><option value="done">เสร็จแล้ว</option><option value="soon">ใกล้ส่ง</option></select></div></div>

</div><nav class="mobile-nav"><button class="active" data-view="tasks"><span>☷</span><span>งาน</span></button><button data-view="announcements"><span>📣</span><span>ประกาศ</span></button><button data-view="members"><span>👥</span><span>สมาชิก</span></button><button id="mobileAdmin"><span>⚙</span><span>แอดมิน</span></button></nav>
<div class="modalback" id="modalกลับ"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><p class="hint" id="modalHint"></p><div id="modalBody"></div><div class="modalactions" id="modalActions"></div></section></div><div class="toast" id="toast" role="status"></div>
<script>
const KEY='pkstudent_54_demo_v1';const today=new Date();const dateFmt=new Intl.DateTimeFormat('th-TH',{weekday:'long',day:'numeric',month:'long'});document.querySelector('#today').textContent=dateFmt.format(today);
const iso=(offset)=>{const d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const seed={members:[{id:'m1',name:'มีนา',avatar:'🦊',done:2},{id:'m2',name:'ต้นกล้า',avatar:'🐻',done:1},{id:'m3',name:'ฟ้าใส',avatar:'🐰',done:3},{id:'m4',name:'ปุณณ์',avatar:'🐼',done:0},{id:'m5',name:'ข้าวหอม',avatar:'🐱',done:4},{id:'m6',name:'ภูมิ',avatar:'🐯',done:2},{id:'m7',name:'ใบเตย',avatar:'🐸',done:1},{id:'m8',name:'เจเจ',avatar:'🐶',done:0}],tasks:[{id:'t1',title:'แบบฝึกหัดสมการเชิงเส้น หน้า 42–43',subject:'คณิตศาสตร์',due:iso(0),note:'ทำข้อ 1–10 ลงสมุด ส่งต้นคาบ',done:false},{id:'t2',title:'สรุปการทดลองเรื่องแรงและการเคลื่อนที่',subject:'วิทยาศาสตร์',due:iso(1),note:'เขียนสรุปผลพร้อมวาดกราฟ',done:false},{id:'t3',title:'อ่านบทที่ 4 และตอบคำถามท้ายบท',subject:'ภาษาอังกฤษ',due:iso(2),note:'ข้อ 1–5 ใน workbook',done:false},{id:'t4',title:'เรียงความ “ชุมชนของฉัน”',subject:'ภาษาไทย',due:iso(4),note:'ความยาว 1 หน้ากระดาษ',done:true},{id:'t5',title:'แผนที่ภูมิภาคเอเชียตะวันออกเฉียงใต้',subject:'สังคมศึกษา',due:iso(-1),note:'ติดสีและระบุเมืองหลวง',done:false}],announcements:[{id:'a1',text:'พรุ่งนี้มีสอบย่อยคณิตศาสตร์ บทสมการ อย่าลืมทบทวนกันนะ',date:Date.now()-3600000},{id:'a2',text:'ส่งใบอนุญาตทัศนศึกษาให้ครูประจำชั้นภายในวันศุกร์',date:Date.now()-86400000}],adminPin:'5404'};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed}catch{data=seed}let view='tasks',modalMode='',adminUnlocked=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(data))}function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}function dayDiff(s){return Math.round((new Date(s+'T00:00:00')-new Date(iso(0)+'T00:00:00'))/86400000)}function dateLabel(s){return new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'short'}).format(new Date(s+'T00:00:00'))}
function render(){const open=data.tasks.filter(t=>!t.done),soon=open.filter(t=>dayDiff(t.due)<=2).length;$('#pendingCount').textContent=open.length;$('#soonCount').textContent=soon;$('#memberCount').textContent=data.members.length;$('#pendingHint').textContent=soon?`มี ${soon} งานที่ต้องรีบดู`:'ยังไม่มีงานใกล้ถึงกำหนด';$('#announceCount').textContent=data.announcements.length?`(${data.announcements.length})`:'';renderTasks();renderAnnouncements();renderMembers();setView(view)}
function renderTasks(){const q=$('#search').value.trim().toLowerCase(),f=$('#filter').value;const ts=[...data.tasks].filter(t=>(!q||`${t.title} ${t.subject} ${t.note}`.toLowerCase().includes(q))&&(f==='all'||f==='open'&&!t.done||f==='done'&&t.done||f==='soon'&&!t.done&&dayDiff(t.due)<=2)).sort((a,b)=>Number(a.done)-Number(b.done)||a.due.localeCompare(b.due));$('#taskList').innerHTML=ts.length?ts.map(t=>{const n=dayDiff(t.due),cls=n<0?'late':n<=1?'soon':'';return `<article class="task ${t.done?'completed':''}"><button class="check ${t.done?'done':''}" data-done="${esc(t.id)}" aria-label="${t.done?'ทำเครื่องหมายว่ายังไม่เสร็จ':'ทำเครื่องหมายว่าเสร็จ'}">✓</button><div><h3 class="tasktitle">${esc(t.title)}</h3><div class="taskmeta"><span class="subject">${esc(t.subject)}</span><span class="deadline ${cls}">${t.done?'ส่งแล้ว':n<0?`เลยกำหนด ${Math.abs(n)} วัน`:n===0?'ส่งวันนี้':`ส่ง ${dateLabel(t.due)}`}</span></div>${t.note?`<p class="taskdesc">${esc(t.note)}</p>`:''}</div><button class="taskmenu" data-taskmenu="${esc(t.id)}" aria-label="ตัวเลือกงาน">⋯</button></article>`}).join(''):'<div class="empty">ยังไม่เจองานที่ตรงกัน ✨</div>'}
function renderAnnouncements(){const all=[...data.announcements].sort((a,b)=>b.date-a.date),fmt=a=>`<article class="announcement"><b>${esc(a.text)}</b><time>${new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(a.date))}</time></article>`;$('#announcementPreview').innerHTML=all.slice(0,2).map(fmt).join('')||'<div class="empty">ยังไม่มีประกาศ</div>';$('#announceView').innerHTML=all.length?`<section class="panel"><div class="panelhead"><h3>ประกาศทั้งหมด</h3></div>${all.map(a=>`${fmt(a)}${adminUnlocked?`<button class="danger" data-delete-ann="${esc(a.id)}">ลบประกาศ</button>`:''}`).join('')}</section>`:'<div class="empty">ยังไม่มีประกาศจากแอดมิน</div>'}
function renderMembers(){const list=data.members,people=list.slice(0,5).map(p=>`<div class="people"><div class="person"><span class="avatar">${esc(p.avatar)}</span><span class="pname">${esc(p.name)}</span></div><span class="pdone">ส่งแล้ว ${p.done||0} งาน</span></div>`).join('');$('#peoplePreview').innerHTML=people+ (list.length>5?`<div class="morepeople">และอีก ${list.length-5} คน · รวม ${list.length} คน</div>`:'');$('#memberView').innerHTML=`<section class="panel"><div class="panelhead"><h3>สมาชิกห้อง 5/4 · ${list.length} คน</h3></div>${list.map(p=>`<div class="people"><div class="person"><span class="avatar">${esc(p.avatar)}</span><span class="pname">${esc(p.name)}</span></div><span class="pdone">ส่งแล้ว ${p.done||0} งาน</span>${adminUnlocked?`<button class="danger" data-delete-member="${esc(p.id)}">ลบ</button>`:''}</div>`).join('')}</section>`}
function setView(v){view=v;$('#taskList').hidden=v!=='tasks';$('#announceView').hidden=v!=='announcements';$('#memberView').hidden=v!=='members';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(innerWidth<760&&v!=='tasks')document.querySelector('main').scrollIntoView({behavior:'smooth',block:'start'})}
function openModal(title,hint,body,actions){$('#modalTitle').textContent=title;$('#modalHint').textContent=hint;$('#modalBody').innerHTML=body;$('#modalActions').innerHTML=actions;$('#modalกลับ').classList.add('show');$('#modalBody').querySelector('input,textarea,select')?.focus()}
function closeModal(){$('#modalกลับ').classList.remove('show')}function button(label,attr,klass='primary'){return `<button class="${klass}" ${attr}>${label}</button>`}function showLogin(){openModal('เข้าสู่ระบบแอดมิน','สำหรับหัวหน้าห้องหรือครูผู้ดูแล',`<div class="field"><label for="pin">รหัสแอดมิน</label><input id="pin" inputmode="numeric" type="password" placeholder="กรอกรหัส 4 หลัก"></div><div class="notice">รหัสทดลอง: <b>5404</b> · ข้อมูลตัวอย่างบันทึกในเบราว์เซอร์นี้</div>`,button('เข้าสู่ระบบ','id="loginSubmit"')+button('ยกเลิก','data-close','secondary'));modalMode='login'}
function adminMenu(){openModal('จัดการห้อง 5/4','เลือกสิ่งที่ต้องการทำ',`<div style="display:grid;gap:9px">${button('＋ เพิ่มสมาชิก','data-mode="member"')}${button('✎ สั่งงานทั้งห้อง','data-mode="task"')}${button('📣 เขียนประกาศ','data-mode="announcement"')}</div>`,button('ปิด','data-close','secondary'));modalMode='admin'}
function showForm(mode){modalMode=mode;const forms={member:['เพิ่มสมาชิก','เพิ่มชื่อเพื่อนในห้อง',`<div class="field"><label>ชื่อที่แสดง</label><input id="name" maxlength="40" placeholder="เช่น พลอย"></div><div class="field"><label>อีโมจิประจำตัว</label><input id="avatar" maxlength="4" value="🙂"></div>`],task:['สั่งงานทั้งห้อง','งานนี้จะแสดงในรายการของทุกคน',`<div class="field"><label>ชื่องาน</label><input id="title" maxlength="120" placeholder="เช่น แบบฝึกหัดหน้า 32"></div><div class="field"><label>วิชา</label><input id="subject" maxlength="40" placeholder="เช่น คณิตศาสตร์"></div><div class="field"><label>กำหนดส่ง</label><input id="due" type="date" value="${iso(2)}"></div><div class="field"><label>รายละเอียดเพิ่มเติม</label><textarea id="note" maxlength="240" placeholder="บอกข้อหรือวิธีส่งงาน"></textarea></div>`],announcement:['เขียนประกาศ','ส่งข้อความให้เพื่อนในห้องเห็น',`<div class="field"><label>ข้อความประกาศ</label><textarea id="text" maxlength="300" placeholder="พิมพ์ประกาศที่นี่"></textarea></div>`]};const [t,h,b]=forms[mode];openModal(t,h,b,button(mode==='member'?'เพิ่มสมาชิก':mode==='task'?'ประกาศงาน':'โพสต์ประกาศ','id="saveAction"')+button('กลับ','data-mode="admin"','secondary'))}
function handleSave(){const mode=modalMode;if(mode==='member'){const name=$('#name').value.trim();if(!name)return toast('กรอกชื่อสมาชิกก่อน');data.members.push({id:crypto.randomUUID(),name,avatar:$('#avatar').value.trim()||'🙂',done:0});toast('เพิ่มสมาชิกแล้ว')}if(mode==='task'){const title=$('#title').value.trim(),subject=$('#subject').value.trim();if(!title||!subject)return toast('กรอกชื่องานและวิชาก่อน');data.tasks.push({id:crypto.randomUUID(),title,subject,due:$('#due').value||iso(2),note:$('#note').value.trim(),done:false});toast('ประกาศงานให้ทั้งห้องแล้ว')}if(mode==='announcement'){const text=$('#text').value.trim();if(!text)return toast('พิมพ์ข้อความประกาศก่อน');data.announcements.push({id:crypto.randomUUID(),text,date:Date.now()});toast('โพสต์ประกาศแล้ว')}save();closeModal();render()}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v){setView(v.dataset.view);return}if(e.target.closest('#adminBtn,#mobileAdmin')){showLogin();return}if(e.target.closest('[data-close]')){closeModal();return}const mode=e.target.closest('[data-mode]');if(mode){const m=mode.dataset.mode;if(m==='admin')adminMenu();else showForm(m);return}if(e.target.closest('#loginSubmit')){if($('#pin').value===data.adminPin){closeModal();adminMenu()}else toast('รหัสไม่ถูกต้อง');return}if(e.target.closest('#saveAction')){handleSave();return}const done=e.target.closest('[data-done]');if(done){const t=data.tasks.find(x=>x.id===done.dataset.done);if(t){t.done=!t.done;save();render();toast(t.done?'ทำเครื่องหมายว่าเสร็จแล้ว':'ย้ายกลับมางานค้าง')}return}const menu=e.target.closest('[data-taskmenu]');if(menu){const t=data.tasks.find(x=>x.id===menu.dataset.taskmenu);if(t){openModal(t.title,'ตัวเลือกงาน',`<div class="notice">${esc(t.subject)} · กำหนดส่ง ${dateLabel(t.due)}</div>`,button(t.done?'ทำเครื่องหมายว่ายังไม่เสร็จ':'ทำเครื่องหมายว่าเสร็จ','id="toggleTask"')+button('ปิด','data-close','secondary'));$('#toggleTask').onclick=()=>{t.done=!t.done;save();closeModal();render()}}return}});document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));$('#search').addEventListener('input',renderTasks);$('#filter').addEventListener('change',renderTasks);$('#modalกลับ').addEventListener('click',e=>{if(e.target.id==='modalกลับ')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script><script><script>
adminMenu=function(){openModal('จัดการห้อง 5/4','เลือกสิ่งที่ต้องการทำ','<div style="display:grid;gap:9px">'+button('เพิ่มสมาชิก','data-mode="member"')+button('สั่งงานทั้งห้อง','data-mode="task"')+button('เขียนประกาศ','data-mode="announcement"')+button('จัดการ/ลบงานที่สั่ง','data-manage-tasks','secondary')+'</div>',button('ออกจากระบบแอดมิน','data-admin-logout','secondary'))};
document.addEventListener('click',function(e){if(e.target.closest('#loginSubmit')&&document.querySelector('#pin').value===data.adminPin){adminUnlocked=true;setTimeout(render,0)}if(e.target.closest('[data-admin-logout]')){adminUnlocked=false;closeModal();render()}if(e.target.closest('[data-manage-tasks]')){var rows=data.tasks.map(function(t){return '<div class="admin-row"><span>'+esc(t.title)+'<br><small>'+esc(t.subject)+' · '+dateLabel(t.due)+'</small></span><button class="danger" data-delete-task="'+esc(t.id)+'">ลบ</button></div>'}).join('');openModal('งานที่สั่งทั้งห้อง','เลือกลบงานที่ไม่ต้องการ',rows||'<div class="empty">ยังไม่มีงาน</div>',button('กลับ','data-mode="admin"','secondary'))}var x=e.target.closest('[data-delete-task],[data-delete-ann],[data-delete-member]');if(x&&adminUnlocked&&confirm('ยืนยันการลบรายการนี้หรือไม่?')){if(x.dataset.deleteTask)data.tasks=data.tasks.filter(function(t){return t.id!==x.dataset.deleteTask});if(x.dataset.deleteAnn)data.announcements=data.announcements.filter(function(a){return a.id!==x.dataset.deleteAnn});if(x.dataset.deleteMember)data.members=data.members.filter(function(m){return m.id!==x.dataset.deleteMember});save();render();toast('ลบรายการแล้ว')}},true);
</script></body></html>
